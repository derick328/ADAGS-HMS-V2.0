name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # Runs the full test suite (Testcontainers Postgres + Redis, ArchUnit)
      # and, as part of `build`, regenerates api/openapi.yaml from the live
      # API surface (see generateOpenApiDocs in build.gradle.kts).
      - name: Build and test
        working-directory: backend
        run: ./gradlew build --no-daemon

      # api/openapi.yaml is committed, not gitignored, precisely so this diff
      # can catch a rename or a new endpoint that was never regenerated for —
      # frontend/CLAUDE.md: "a rename must break the frontend build, not
      # production."
      - name: Fail if api/openapi.yaml is stale
        run: git diff --exit-code -- api/openapi.yaml

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      # Regenerates src/shared/api/types.ts from the committed api/openapi.yaml
      # and fails if that changes anything — the generated file must never be
      # hand-edited or left behind a backend change.
      - name: Fail if src/shared/api/types.ts is stale
        working-directory: frontend
        run: |
          pnpm run generate-api-types
          git diff --exit-code -- src/shared/api/types.ts

      - name: Type-check and build
        working-directory: frontend
        run: pnpm run build

  deploy:
    name: Deploy to Contabo
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/phase0/admin-sidebar-and-permission-catalogue'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://adagshms.derutech.com
    concurrency:
      group: adags-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Deploy tested commit over SSH
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" && test -n "$VPS_USER"
          test -n "$VPS_SSH_KEY" && test -n "$VPS_KNOWN_HOSTS"
          umask 077
          trap 'rm -f "$RUNNER_TEMP/vps-deploy-key" "$RUNNER_TEMP/vps-known-hosts"' EXIT
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/vps-deploy-key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/vps-known-hosts"
          ssh -i "$RUNNER_TEMP/vps-deploy-key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/vps-known-hosts" \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 \
            -p "${VPS_PORT:-22}" \
            "$VPS_USER@$VPS_HOST" \
            "bash -s -- '$GITHUB_SHA'" < deploy/deploy-from-ci.sh
