spring:
  application:
    name: adags-backend
  # Login goes through AuthenticationService/SessionStore, never Spring
  # Security's AuthenticationManager — this default user would be dead weight.
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:15432}/${DB_NAME:adags}
    username: ${DB_USER:adags}
    password: ${DB_PASSWORD:adags}
    hikari:
      pool-name: adags-pool

  jpa:
    hibernate:
      # Flyway owns the schema. This must never be 'update' or 'create-drop'
      # outside tests — a silently auto-migrated column is a production incident.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  servlet:
    multipart:
      # 15-lab-technician.md §5.4: machine output (an analyser PDF/print
      # capture), not a general upload surface — generous enough for a
      # scanned instrument printout without accepting arbitrary large files.
      max-file-size: 20MB
      max-request-size: 20MB

adags:
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:adags}
    secret-key: ${MINIO_SECRET_KEY:adags-minio-secret}
    lab-machine-output-bucket: ${MINIO_LAB_MACHINE_OUTPUT_BUCKET:lab-machine-output}
  bootstrap:
    admin-username: ${ADAGS_BOOTSTRAP_ADMIN_USERNAME:admin}
    # ADAGS_BOOTSTRAP_ADMIN_PASSWORD is required by the V3 bootstrap-admin
    # migration (db.migration.V3__BootstrapAdmin, the install-time secret).
    # There is no default — the migration fails rather than seed a guessable
    # password. It is a Java migration, not SQL, precisely so this secret is
    # never baked into Flyway's checksummed migration text.
  auth:
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 7
  # Patient duplicate-detection thresholds (05-receptionist.md §4.1) live in
  # the protocol_setting table (V7__protocol_setting.sql), not here — an
  # admin needs to tune them against real data without a redeploy. See
  # RegisterPatientService and backend/CLAUDE.md.

server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.adags: INFO
