spring:
  application:
    name: adags-backend
  # Login goes through AuthenticationService/SessionStore, never Spring
  # Security's AuthenticationManager — this default user would be dead weight.
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:15432}/${DB_NAME:adags}
    username: ${DB_USER:adags}
    password: ${DB_PASSWORD:adags}
    hikari:
      pool-name: adags-pool

  jpa:
    hibernate:
      # Flyway owns the schema. This must never be 'update' or 'create-drop'
      # outside tests — a silently auto-migrated column is a production incident.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

adags:
  bootstrap:
    admin-username: ${ADAGS_BOOTSTRAP_ADMIN_USERNAME:admin}
    # ADAGS_BOOTSTRAP_ADMIN_PASSWORD is required by the V3 bootstrap-admin
    # migration (db.migration.V3__BootstrapAdmin, the install-time secret).
    # There is no default — the migration fails rather than seed a guessable
    # password. It is a Java migration, not SQL, precisely so this secret is
    # never baked into Flyway's checksummed migration text.
  auth:
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 7

server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.adags: INFO
