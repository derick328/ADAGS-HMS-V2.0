components:
  schemas:
    MedicinePurchaseCost:
      type: object
      properties:
        unit: { type: string }
        amountMinor: { type: integer, format: int64, minimum: 0, description: Whole TZS amount per selected purchase unit }
        updatedBy: { type: string, format: uuid }
        updatedAt: { type: string, format: date-time }
    UpdateMedicinePurchaseCost:
      type: object
      required: [unit, amountMinor]
      properties:
        unit: { type: string }
        amountMinor: { type: integer, format: int64, minimum: 0 }
    ClinicAssignmentsRequest:
      type: object
      properties:
        unitIds:
          type: array
          items:
            type: string
            format: uuid
        primaryUnitId:
          type: string
          format: uuid
        hodUnitId:
          type: string
          format: uuid
        vacateHodUnitIds:
          type: array
          items:
            type: string
            format: uuid
    JsonNode:
      type: object
    SaveDraftRequest:
      type: object
      properties:
        version:
          type: integer
          format: int64
        payload:
          $ref: "#/components/schemas/JsonNode"
    DraftResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        specimenId:
          type: string
          format: uuid
        ownerId:
          type: string
          format: uuid
        payload:
          $ref: "#/components/schemas/JsonNode"
        version:
          type: integer
          format: int64
        status:
          type: string
        submittedResultId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
