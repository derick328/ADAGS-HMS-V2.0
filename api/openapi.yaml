openapi: 3.0.1
info:
  title: ADAGS Hospital Management System API
  version: v0
servers:
- url: http://localhost
  description: Generated server url
paths:
  /auth/refresh:
    post:
      tags:
      - auth-controller
      operationId: refresh
      parameters:
      - name: adags_refresh
        in: cookie
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TokenResponse"
  /auth/logout:
    post:
      tags:
      - auth-controller
      operationId: logout
      parameters:
      - name: Authorization
        in: header
        required: false
        schema:
          type: string
      - name: adags_refresh
        in: cookie
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
  /auth/login:
    post:
      tags:
      - auth-controller
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LoginResponse"
  /me:
    get:
      tags:
      - me-controller
      operationId: me
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MeResponse"
components:
  schemas:
    TokenResponse:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        accessToken:
          type: string
        accessTokenExpiresAt:
          type: string
          format: date-time
    LoginRequest:
      required:
      - password
      - username
      type: object
      properties:
        username:
          type: string
        password:
          type: string
    LoginResponse:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        accessToken:
          type: string
        accessTokenExpiresAt:
          type: string
          format: date-time
        mustChangePassword:
          type: boolean
    MeResponse:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        username:
          type: string
        mustChangePassword:
          type: boolean
        permissions:
          type: array
          items:
            type: string
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/ScopeView"
    ScopeView:
      type: object
      properties:
        roleCode:
          type: string
        scopeType:
          type: string
        scopeId:
          type: string
          format: uuid
        validFrom:
          type: string
          format: date-time
        validTo:
          type: string
          format: date-time
