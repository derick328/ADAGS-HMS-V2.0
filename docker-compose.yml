services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: adags
      POSTGRES_USER: adags
      POSTGRES_PASSWORD: adags
    ports:
      # Host-side 15432, not 5432 — avoids clashing with a local Postgres
      # install, which is common enough on dev machines to plan around.
      - "15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adags -d adags"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  storage:
    image: rustfs/rustfs:1.0.3
    command: /data
    environment:
      RUSTFS_ACCESS_KEY: adags
      RUSTFS_SECRET_KEY: adags-minio-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - storage-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
  storage-data:
